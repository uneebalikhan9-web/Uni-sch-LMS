<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Rounded Box Background matching Image 2 -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Graduation Cap Icon -->
  <g transform="translate(0, 8)">
    <!-- Top Mortarboard Diamond -->
    <polygon points="256,128 416,208 256,288 96,208" fill="none" stroke="#1e1b4b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="256,140 400,208 256,276 112,208" fill="url(#capGrad)" opacity="0.15"/>

    <!-- Cap Skull Base -->
    <path d="M160,242 L160,336 C160,368 203,392 256,392 C309,392 352,368 352,336 L352,242" fill="none" stroke="#1e1b4b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160,242 L160,336 C160,368 203,392 256,392 C309,392 352,368 352,336 L352,242 Z" fill="url(#capGrad)" opacity="0.2"/>

    <!-- Tassel String and Button -->
    <circle cx="256" cy="208" r="10" fill="#4f46e5"/>
    <path d="M256,208 C290,208 308,240 308,300" fill="none" stroke="#1e1b4b" stroke-width="16" stroke-linecap="round"/>
    <!-- Tassel Fringe -->
    <path d="M308,295 L300,340 M308,295 L308,345 M308,295 L316,340" stroke="#4f46e5" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
